<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Robot Games 100 — Cover</title>
    <script src="js/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #090c12;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090c12;
        color: #edf2fb;
        font-family: system-ui, sans-serif;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #cover {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #cover-fade {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(900px 420px at 70% 0%, rgba(255, 176, 32, 0.16), transparent 55%),
          rgba(9, 12, 18, 0.78);
      }
      .card { position: relative; text-align: center; }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 92px;
        height: 92px;
        margin-bottom: 22px;
        border-radius: 22px;
        background: #ffb020;
        color: #1a1204;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      h1 {
        margin: 0;
        font-size: 108px;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 0.95;
      }
      .lede {
        margin: 18px 0 0;
        color: #9aa8be;
        font-size: 28px;
        letter-spacing: 0.01em;
      }
      #solo-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 64px;
        text-align: center;
        font-size: 26px;
        font-weight: 650;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ffb020;
      }
      #lockup {
        position: absolute;
        left: 0;
        right: 0;
        top: 22px;
        display: grid;
        place-items: center;
      }
      #lockup-inner {
        padding: 8px 18px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        background: rgba(9, 12, 18, 0.78);
        font-size: 22px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="stage" class="clip" data-start="0" data-duration="12" data-track-index="0" data-layout-allow-overflow="true" width="1920" height="1080"></canvas>

      <section id="cover" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="cover-fade">
          <div class="scrim"></div>
          <div class="card">
            <div class="mark">100</div>
            <h1>ROBOT GAMES</h1>
            <p class="lede">Running, jumping, and every kind of ball</p>
          </div>
        </div>
      </section>

      <div id="solo-label"></div>

      <section id="lockup" class="clip" data-start="10" data-duration="2" data-track-index="2">
        <div id="lockup-inner">100 games</div>
      </section>
    </div>

    <script src="js/catalog.js"></script>
    <script src="js/stage.js"></script>
    <script>
      const COLS = 5;
      const CENTER = 2.5;
      const RING = [
        "sprint", "hurdles", "longjump", "highjump", "shot",
        "basketball", "volleyball", "handball", "football",
        "baseball", "tennis", "badminton", "golf",
        "bowling", "boxing", "karate", "freestyle",
        "diving", "surfing", "rowing", "alpine",
        "hockey", "cycling", "handstand",
      ];
      const CELLS = [];
      for (let i = 0, ring = 0; i < COLS * COLS; i += 1) {
        CELLS.push(i === 12 ? "soccer" : RING[ring++]);
      }
      const BY_ID = Object.create(null);
      GAMES.forEach((game) => {
        BY_ID[game.id] = game;
      });

      const stage = document.getElementById("stage");
      const label = document.getElementById("solo-label");
      const off = document.createElement("canvas");
      off.width = 1280;
      off.height = 720;
      const offCtx = off.getContext("2d");

      function smooth(t) {
        const u = Math.max(0, Math.min(1, t));
        return u * u * (3 - 2 * u);
      }

      function spanAt(t) {
        if (t < 4.9) return 1;
        if (t < 7.3) return 1 + 2 * smooth((t - 4.9) / (7.3 - 4.9));
        if (t < 10.15) return 3 + 2 * smooth((t - 7.3) / (10.15 - 7.3));
        return 5;
      }

      function heroId(t) {
        if (t < 3.45) return "sprint";
        if (t < 4.6) return "basketball";
        return "soccer";
      }

      function paint(t) {
        const across = spanAt(t);
        const ctx = stage.getContext("2d");
        const w = 1920;
        const h = 1080;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#090c12";
        ctx.fillRect(0, 0, w, h);

        const cellW = w / across;
        const cellH = h / across;
        const originX = w / 2 - CENTER * cellW;
        const originY = h / 2 - CENTER * cellH;
        const gap = across < 1.25 ? 0 : Math.min(14, cellW * 0.03);

        for (let i = 0; i < CELLS.length; i += 1) {
          const col = i % COLS;
          const row = Math.floor(i / COLS);
          const x = originX + col * cellW;
          const y = originY + row * cellH;
          if (x > w || y > h || x + cellW < 0 || y + cellH < 0) continue;
          const id = i === 12 ? heroId(t) : CELLS[i];
          const game = BY_ID[id];
          const phase = (((t * game.speed) % 1) + 1) % 1;
          offCtx.setTransform(1, 0, 0, 1, 0, 0);
          renderFrame(offCtx, off.width, off.height, game, phase);
          ctx.drawImage(off, x + gap / 2, y + gap / 2, cellW - gap, cellH - gap);
        }

        let name = "";
        let alpha = 0;
        if (t < 3.45) name = "100m Sprint";
        else if (t < 4.6) name = "Basketball";
        else name = "Soccer";
        if (t < 2.55) alpha = 0;
        else if (t < 2.95) alpha = smooth((t - 2.55) / 0.4);
        else if (t < 4.95) alpha = 1;
        else if (t < 5.55) alpha = 1 - smooth((t - 4.95) / 0.6);
        label.textContent = alpha > 0.02 ? name : "";
        label.style.opacity = String(alpha);
      }

      const tl = gsap.timeline({
        paused: true,
        onUpdate() {
          paint(tl.time());
        },
      });
      tl.set("#cover-fade", { opacity: 1, y: 0 }, 0);
      tl.to("#cover-fade", { opacity: 0, y: -22, duration: 0.65, ease: "power2.in" }, 2.15);
      tl.fromTo("#lockup-inner", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 10.15);
      window.__timelines["main"] = tl;
      tl.seek(0);
      paint(0);
    </script>
  </body>
</html>
